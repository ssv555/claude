############################
# HTTPS + HTTP2 + HTTP3    #
# Per-dev stand: dev-{{ALIAS}}.it-joy.ru
# Generated by /dev add — DO NOT EDIT manually
############################
server {
    server_name dev-{{ALIAS}}.it-joy.ru;
    root /var/www/dev-{{ALIAS}}.it-joy.ru;

    listen 127.0.0.1:8444 ssl proxy_protocol;
    http2 on;
    http3 on;
    quic_gso on;
    quic_retry on;
    ssl_early_data on;

    ssl_certificate /etc/letsencrypt/live/dev-{{ALIAS}}.it-joy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-{{ALIAS}}.it-joy.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    if ($http_referer ~* badbot) { return 403; }

    # API → Bun on dev's localhost:{{PORT_API}}
    location ^~ /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:{{PORT_API}};
    }

    # Frontend + HMR → Vite on dev's localhost:{{PORT_HMR}}
    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:{{PORT_HMR}};
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /var/www/dev-{{ALIAS}}.it-joy.ru; }
}

server {
    listen 80;
    server_name dev-{{ALIAS}}.it-joy.ru;
    return 301 https://dev-{{ALIAS}}.it-joy.ru$request_uri;
}
